name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate the release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag, CMake version, overlay version and release notes
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/check-release-tag.py "$RELEASE_TAG")"
          test -s "docs/releases/$RELEASE_TAG.md"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == 0.* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Test and build this tag
    needs: validate
    permissions:
      contents: read
    # A local reusable workflow uses this tag's exact source revision.
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Verify and publish the tested assets
    needs: [validate, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact artifact produced by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.release-artifact-id }}
          path: dist/release
          digest-mismatch: error
          # No token/run override: download only from the current workflow run.
      - name: Recheck tag and downloaded archive provenance
        run: |
          python3 scripts/check-release-tag.py "$RELEASE_TAG"
          python3 scripts/verify-package.py dist/release \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Create a new draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          # Resolve lightweight and annotated remote tags to the tested commit.
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          obj = api(f"repos/{repo}/git/ref/tags/{tag}")["object"]
          for _ in range(8):
              if obj["type"] != "tag":
                  break
              obj = api(f"repos/{repo}/git/tags/{obj['sha']}")["object"]
          if obj["type"] != "commit" or obj["sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Remote release tag no longer points to the tested commit")
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for this tag; assets will not be replaced."
            exit 1
          fi
          assets=(
            "dist/release/CloudTuneNX-$RELEASE_VERSION-sd.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-symbols.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-docs.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-manifest.json"
            "dist/release/SHA256SUMS"
          )
          notes="$RUNNER_TEMP/cloudtune-release-notes.md"
          cp "docs/releases/$RELEASE_TAG.md" "$notes"
          printf '\n\n构建与验证：[Actions run](%s/%s/actions/runs/%s) · [源码提交](%s/%s/commit/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$notes"
          # No --clobber, deletion or update of an existing release.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "CloudTune NX $RELEASE_TAG" \
            --notes-file "$notes" \
            --draft --prerelease="$RELEASE_PRERELEASE"
          # Leave a failed draft intact for inspection; never replace its assets.
          roundtrip="$RUNNER_TEMP/cloudtune-release-roundtrip"
          mkdir "$roundtrip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$roundtrip"
          python3 scripts/verify-package.py "$roundtrip" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$roundtrip/${asset##*/}"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft=false --prerelease="$RELEASE_PRERELEASE"
