name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，如 v0.2.2；必须匹配所选分支的 CMake 版本与发布说明"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Manual dispatch from main and a tag push share the same publication lock.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate the release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag, CMake version, overlay version and release notes
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/check-release-tag.py "$RELEASE_TAG")"
          test -s "docs/releases/$RELEASE_TAG.md"
          arguments=()
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            arguments+=(--allow-missing-tag)
          fi
          python3 scripts/release-target.py "$RELEASE_TAG" --commit "$GITHUB_SHA" "${arguments[@]}"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  ci:
    name: Test and build this tag
    needs: validate
    permissions:
      contents: read
    # A local reusable workflow uses the caller's immutable event SHA,
    # including manual dispatch from a branch whose new tag does not exist yet.
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ needs.validate.outputs.tag }}

  publish:
    name: Verify and publish the tested assets
    needs: [validate, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact artifact produced by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.release-artifact-id }}
          path: dist/release
          digest-mismatch: error
          # No token/run override: download only from the current workflow run.
      - name: Recheck tag and downloaded archive provenance
        run: |
          python3 scripts/check-release-tag.py "$RELEASE_TAG"
          python3 scripts/verify-package.py dist/release \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Create a new draft, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          # Recheck after CI; only manual dispatch may create a missing tag.
          # The GITHUB_TOKEN-created tag does not trigger another push workflow.
          arguments=()
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            arguments+=(--create-tag)
          fi
          python3 scripts/release-target.py "$RELEASE_TAG" --commit "$GITHUB_SHA" "${arguments[@]}"
          assets=(
            "dist/release/CloudTuneNX-$RELEASE_VERSION-sd.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-symbols.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-docs.zip"
            "dist/release/CloudTuneNX-$RELEASE_VERSION-manifest.json"
            "dist/release/SHA256SUMS"
          )
          notes="$RUNNER_TEMP/cloudtune-release-notes.md"
          cp "docs/releases/$RELEASE_TAG.md" "$notes"
          printf '\n\n构建与验证：[Actions run](%s/%s/actions/runs/%s) · [源码提交](%s/%s/commit/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$notes"
          # No --clobber, deletion or update of an existing release.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "CloudTune NX $RELEASE_TAG" \
            --notes-file "$notes" \
            --draft --prerelease=false
          # Leave a failed draft intact for inspection; never replace its assets.
          roundtrip="$RUNNER_TEMP/cloudtune-release-roundtrip"
          mkdir "$roundtrip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$roundtrip"
          python3 scripts/verify-package.py "$roundtrip" \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$roundtrip/${asset##*/}"
          done
          python3 scripts/release-target.py "$RELEASE_TAG" --commit "$GITHUB_SHA" --verify-tag-only
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft=false --prerelease=false --latest
          {
            printf '## CloudTune NX %s\n\n' "$RELEASE_TAG"
            printf '[下载 SD 安装包](%s/%s/releases/download/%s/CloudTuneNX-%s-sd.zip)\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_VERSION"
            printf '包含 NRO、后台服务和 Tesla 覆盖层；另附符号包、文档包、manifest 与 SHA256SUMS。\n'
          } >> "$GITHUB_STEP_SUMMARY"
